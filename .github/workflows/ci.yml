name: "Continuous Integration (CI)"

on:
  push:
    branches: ["main", "feature/*"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-lint:
    name: "Lint & Automated Tests"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: "Lint with Flake8"
        run: |
          flake8 app tests --count --max-line-length=120 --statistics

      - name: "Run Pytest Suite"
        run: |
          pytest -v --junitxml=test-results.xml

  container-security-scan:
    name: "Docker Build & Trivy Vulnerability Scan"
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Build local test image"
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: cloudops-app:test

      - name: "Run Trivy Vulnerability Scanner"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "cloudops-app:test"
          format: "table"
          exit-code: "0" # Set to 1 if you wish to block pipelines on HIGH/CRITICAL vulnerabilities
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"