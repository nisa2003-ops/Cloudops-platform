name: "Continuous Deployment (CD)"

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write # Mandatory for AWS OIDC authentication
  contents: read

env:
  AWS_REGION: "us-east-1"
  ECR_REPOSITORY: "cloudops-dev-app"

jobs:
  build-publish-deploy:
    name: "Publish Image & Deploy to AWS EC2"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Configure AWS Credentials via OIDC (Zero-Secret)"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
        continue-on-error: true # Allows workflow to succeed in mock/learning runs if OIDC is not yet connected

      - name: "Log in to Amazon ECR"
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        continue-on-error: true

      - name: "Build, tag, and push image to Amazon ECR"
        id: build-image
        if: steps.login-ecr.outcome == 'success'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $REGISTRY/$ECR_REPOSITORY:latest .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest
          echo "image_uri=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: "Deploy to EC2 via AWS SSM Run Command"
        if: steps.build-image.outcome == 'success' && secrets.EC2_INSTANCE_ID != ''
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploying CloudOps Image tag ${{ github.sha }}" \
            --parameters 'commands=[
              "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}",
              "docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}",
              "docker stop cloudops-app || true",
              "docker rm cloudops-app || true",
              "docker run -d --name cloudops-app --restart unless-stopped -p 8000:8000 ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}",
              "sleep 5",
              "curl -f http://localhost:8000/health || (echo \"Deploy failed, rolling back\" && docker run -d --name cloudops-app -p 8000:8000 ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:previous && exit 1)"
            ]'
